apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-test-app
  labels:
    app: python-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-test-app
  template:
    metadata:
      labels:
        app: python-test-app
    spec:
      containers:
      - name: python-test-app
        image: renard17/python-test-app:738f0061a91e914190db83be56e1fee55f02cae5
        imagePullPolicy: Always
        ports:
        - containerPort: 8000